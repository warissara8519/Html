<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <header>
        <h1>Registration Form</h1>
    </header>
    
   
    <main>
        <form action = "#" method="post">
        <fieldset>
        <legend>Personal Information </legend>

            <label for="name">Name :</label>
            <input type = "text"id = "name"name = "name" required maxlength ="50" placeholder =" กรอกชื่อและนามสกุล" >
         
                <br> <br>
            <label for ="email">Email:</label>
            <input type ="email" id = "email" name = "email" required maxlength="50" placeholder=" example@gmail.com" >
            <br><br>
            <label for ="phone">Phone :</label>
            <input  type ="tel" id = "phone" name = "phone" required pattern ="[0-9]{10}" maxlength="10" title="กรุณากรอกเบอร์โทรศัพท์ 10 หลัก" placeholder=" กรอกหมายเลขโทรศัพท์" >
                <br> <br>
            <label for="nation-id">NationID: </label>
            <input type ="text" id ="nation-id" name ="nation-id" required maxlength ="13" pattern ="[0-9]{13}" title ="กรุณากรอกหมายเลขบัตรประชาชน 13 หลัก" placeholder =" กรอกหมายเลขบัตรประชาชน">
                <br> <br>

            <label for="address">Address</label>
            <textarea id ="address" name = "address" required rows = "6" cols = "50" title ="กรุณากรอกที่อยู่" placeholder= " กรอกที่อยู่"></textarea>   
                <br> <br>
       <span>Gen : </span>
        <input type ="radio" id ="gender-male" name ="gender"value="male"required >
        <label for ="gender-male">Male</label>
        <input type ="radio" id = "gender-female" name = "gender" value ="female" required >
        <label for ="gender-female">Female</label>
            <br> <br>

        <input  type ="submit" value ="Submit" >
        <input  type ="reset" value="Cancel" >
    </fieldset>
    </form>
    </main>
